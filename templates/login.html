<!DOCTYPE html>
<html>

<head>
    <title>Student Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Student Login</h1>

        <form action="/dashboard" method="POST">

            <p>Enter your name:</p>

            <input type="text"
                   name="name"
                   placeholder="Enter Name"
                   required>

            <br><br>

            <button type="submit">
                Login
            </button>

        </form>

    </div>

</body>

</html>
