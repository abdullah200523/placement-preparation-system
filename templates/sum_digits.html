<!DOCTYPE html>
<html>

<head>

    <title>Sum of Digits</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container">

    <h1>➕ Sum of Digits</h1>

    <p>Enter a number to find the sum of its digits.</p>

    <form action="/sum-digits" method="POST">

        <input type="number"
               name="number"
               placeholder="Enter a number"
               required>

        <br><br>

        <button type="submit">
            Calculate
        </button>

    </form>

    {% if result %}

        <h2>{{ result }}</h2>

    {% endif %}

    <br>

    <a href="/coding">
        <button>⬅ Back to Coding</button>
    </a>

</div>

</body>

</html>
